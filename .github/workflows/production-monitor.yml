name: Production monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check frontend
        run: curl --fail --silent --show-error --max-time 30 https://agentforge-qccm.vercel.app/ >/dev/null
      - name: Check API and engine
        run: |
          payload="$(curl --fail --silent --show-error --max-time 90 https://agentforge-api-yml4.onrender.com/health)"
          node -e 'const p=JSON.parse(process.argv[1]); if(p.status!=="ok"||p.engine!=="ok") process.exit(1)' "$payload"
